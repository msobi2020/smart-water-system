{% extends 'base.html' %}
{% block title %}Ingia - Smart Water System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4 text-center">Ingia kwenye Akaunti Yako</h2>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Jina la Mtumiaji</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nenosiri</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingia</button>
        </form>
    </div>
</div>
{% endblock %}
<p class="text-center mt-3">
    Huna akaunti? <a href="{% url 'register' %}">Jisajili hapa</a>
</p>
